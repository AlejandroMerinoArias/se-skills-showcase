items:
- id: Q-01
  kind: customer_question
  text: Does a run in which the UAV returns to the entrance within 30 minutes with fewer than four lanterns reported
    have any value to you, compared with a run that keeps searching past 30 minutes?
  blocks:
  - SYS-F-012
  owner: setup
  status: closed
  answer: 'No value: a run without all four lanterns fails either way; no early-return deadline wanted.'
  evidence: null
- id: Q-02
  kind: customer_question
  text: Should the lantern output list only the four cave lanterns, or also include the reference lantern at the
    start point?
  blocks:
  - SYS-F-013
  owner: setup
  status: closed
  answer: Only the four cave lanterns are listed; the reference lantern is excluded.
  evidence: null
- id: Q-03
  kind: customer_question
  text: Which Ubuntu version and ROS 2 distribution run on the machine where you will run and judge the system?
  blocks:
  - SYS-C-005
  owner: setup
  status: closed
  answer: Ubuntu 24.04 with ROS 2 Jazzy.
  evidence: null
- id: Q-04
  kind: customer_question
  text: How many simulation runs must succeed, out of how many attempts, for you to accept the system?
  blocks:
  - SYS-P-005
  owner: setup
  status: closed
  answer: At least 2 of 3 runs must succeed.
  evidence: null
- id: E-01
  kind: experiment
  text: Which camera streams does the Unity binary actually send (RGB, depth, semantic?), and what cue identifies
    a lantern in them (semantic label, colour, brightness)?
  blocks:
  - SYS-F-004
  owner: I0
  status: closed
  answer: Semantic camera /Quadrotor/Sensors/SemanticCamera/image_raw (320x240, 5.1 Hz) marks lanterns as RGB (255,235,4)
    on black; depth 16UC1 mm; FOV 106x90 deg.
  evidence: evidence/E-01.md
- id: E-02
  kind: experiment
  text: Does the provided workspace build with colcon on Ubuntu 24.04 / ROS 2 Jazzy in WSL2, and does the Unity
    binary run there with its sensor streams at usable rate (real-time factor)?
  blocks:
  - SYS-C-005
  owner: I0
  status: closed
  answer: Builds 4/4 packages on 24.04/Jazzy; runs with GALLIUM_DRIVER=d3d12 at depth 5.1 Hz, RGB 10.3 Hz, state
    50 Hz (3 runs); CPU rendering drops cameras to 1.6 Hz.
  evidence: evidence/E-02.md
- id: E-03
  kind: experiment
  text: Where is the cave mouth relative to the UAV start point in the state-estimate world frame, and what obstacle-free
    waypoint route reaches it?
  blocks:
  - SYS-F-001
  owner: I0
  status: closed
  answer: Mouth is a rock arch at x ⟨…⟩, y ⟨…⟩, z ⟨…⟩; entrance E=⟨x, y, z⟩ via ⟨x, y, z⟩,⟨x, y, z⟩;
    reached 9/9 with 0.00 m error, no contact (D-05).
  evidence: evidence/E-03.md
- id: E-04
  kind: experiment
  text: How large does the state-estimate error (corrupted minus true position) grow over a 30-minute flight? The
    corruptor never reads its jump_seconds parameter, so drift jumps may be disabled.
  blocks:
  - SYS-P-001
  owner: I0
  status: closed
  answer: Static estimator error <= 0.020 m with no growth over 3 x 308 s flights; drift branch is dead code (jump_seconds
    never read), only 5 mm white noise.
  evidence: evidence/E-04.md
- id: E-05 (not published)
  kind: experiment
  text: Can the true lantern positions be obtained (e.g. from the simulation's true-state stream or scene data)
    so that an offline scoring tool can check SYS-P-001?
  blocks:
  - SYS-P-001
  owner: I0
  status: closed
  answer: 'Yes: scene-file positions (UnityPy) match the sim within 0.45 m horizontally; scene origin is 1.7 m below
    the visible lantern base (lantern about 4.5 m tall), see Q-06.'
  evidence: evidence/E-05.md (not published)
- id: E-06
  kind: experiment
  text: Can reference cave geometry be obtained (scene data in ⟨redacted⟩, or a truth-pose mapping run used
    only for scoring) to judge map coverage for SYS-P-004? Also measure the narrowest passage width and the depth
    camera range and field of view (these back SYS-P-003 and the 5 m band in SYS-P-004).
  blocks:
  - SYS-P-004
  - SYS-P-003
  owner: I0
  status: closed
  answer: 'Yes: 19.2 M-point reference surface; 100% of flown depth points within 0.5 m of it; sampled passages
    22-36 m wide, 16-39 m high (lantern niche 2.5 x 1.8 m).'
  evidence: evidence/E-06.md
- id: D-01
  kind: design_decision
  text: After four lanterns are found, return immediately or keep mapping first? (re-triaged from a customer question
    in review round 1)
  blocks:
  - SYS-F-006
  - SYS-P-004
  owner: setup
  status: closed
  answer: Return immediately; brief 1.1 asks for 'as fast as possible' and map quality is judged on the flown path
    only. See architecture.md D-01.
  evidence: null
- id: E-07
  kind: experiment
  text: Does the stack run on wall-clock time or on a simulation /clock, and how do the two relate during a run?
    This decides which clock the timing requirements use.
  blocks:
  - SYS-P-002
  - SYS-F-002
  owner: I0
  status: closed
  answer: 'Wall-clock time: stamps are ROS system time, no /clock, RTF 1.001 (3 runs); timing requirements use wall
    seconds.'
  evidence: evidence/E-07.md
- id: E-08
  kind: experiment
  text: Can UAV contact with the cave surface be detected in a run (e.g. from discontinuities in true-state velocity),
    so that SYS-S-001 can be checked?
  blocks:
  - SYS-S-001
  owner: I0
  status: closed
  answer: Yes, offline via tracking error |p_true - p_setpoint| > 1.0 m (7.82 m on contact flight vs <= 0.26 m on
    5 clean flights); accel spikes unusable.
  evidence: evidence/E-08.md
- id: E-09
  kind: experiment
  text: At what rate does /current_state_est publish, and what is the largest gap between messages during a run?
  blocks:
  - SYS-S-002
  owner: I0
  status: closed
  answer: 50.0 Hz, largest gap 43 ms (3 runs x 30 s, GPU rendering); SYS-S-002's 0.5 s threshold is 12x that gap.
  evidence: evidence/E-09.md
- id: Q-06
  kind: customer_question
  text: 'Each lantern is an object about 4.5 m tall. When you check that a reported lantern is ''within 2 m of the
    true lantern position'', which point is the true position: the centre of the visible lantern, or the simulator''s
    internal object origin (which for the reference lantern lies about 1.7 m below its visible bottom)?'
  blocks:
  - SYS-P-001
  owner: I0
  status: closed
  answer: The true position is the centre of the visible lantern.
  evidence: null
- id: E-10 (not published)
  kind: experiment
  text: For each of the four cave lanterns, where is the centre of its visible (semantic) pixels, back-projected
    with the true pose, relative to its scene-file origin? (Gives the scoring truth for SYS-P-001.)
  blocks:
  - SYS-P-001
  owner: I3
  status: closed
  answer: "Visible centre = scene origin + ⟨x, y, z⟩ m (\xB10.1 m in z; 2 lanterns x 3 runs; one prefab transform\
    \ for all five): the scoring truth for SYS-P-001."
  evidence: evidence/E-10.md (not published)
- id: E-11
  kind: experiment
  text: Does the presence of /dev/dxg distinguish a WSL2 host with GPU passthrough from a native Ubuntu host (where
    it must be absent)?
  blocks:
  - ITEM-D-008
  owner: I1
  status: closed
  answer: 'Yes: /dev/dxg present on the WSL2 kernel with dxgkrnl (3/3); dxgkrnl is WSL-only (not mainline), so absent
    on native Ubuntu; ITEM-D-008 stands.'
  evidence: evidence/E-11.md
- id: E-12
  kind: experiment
  text: Inside the dark cave, do the four cave lanterns still appear in the semantic image as pure (255,235,4) pixels,
    and from what range?
  blocks:
  - SYS-F-004
  owner: I3
  status: closed
  answer: 'Yes: only exact (255,235,4) pixels in the dark cave (0 impure of 329 549, 3 runs); detected in 100 %
    of in-view frames to 50 m, about 70 % at 50-60 m, none by 90 m; 3D limited to about 50 m by the depth range.'
  evidence: evidence/E-12.md
- id: E-13
  kind: experiment
  text: During a mapping flight, what fraction of depth-derived point clouds does octomap_server fail to insert
    (dropped or delayed > 1 s)?
  blocks:
  - ITEM-D-005
  owner: I1
  status: closed
  answer: octomap_server inserts only 26-48 % of clouds in flight (100 % at rest); D-08 reversed, replaced by our
    own mapper (D-12).
  evidence: evidence/E-13.md
- id: Q-07
  kind: customer_question
  text: 'Do you approve these two design-level restatements of your ''never the true pose'' constraint for I1? (a)
    ITEM-D-001: cameras are attached to the estimated body frame, and none of the provided truth-attached transforms
    are started; (b) ITEM-D-010: the mission, planning and perception nodes read the UAV position only from the
    corrupted state estimate.'
  blocks:
  - ITEM-D-001
  - ITEM-D-010
  owner: I1
  status: closed
  answer: Customer approves ITEM-D-001 and ITEM-D-010.
  evidence: null
- id: E-15
  kind: experiment
  text: Is there enough clearance at the entrance point and through the mouth for the I2 planner (1.5 m) to return
    to within 1.0 m of E and to enter the gallery?
  blocks:
  - ITEM-D-016
  - SYS-F-006
  owner: I2
  status: closed
  answer: E has 6.58 m clearance (return feasible); the mouth narrows to 1.15 m on the flown line, so D-14 falls
    back to 1.0 m and ITEM-D-016's minimum is 1.0 m.
  evidence: evidence/E-15.md
- id: Q-08
  kind: customer_question
  text: 'Do you approve the I2 critical design statements: ITEM-D-013 (exploration goals only from frontiers of
    the map built this run, beyond the entrance plane), ITEM-D-014 (in EXPLORE only planner-generated paths are
    flown), ITEM-D-016 (paths only through known-free space, at least 1.0 m from walls)?'
  blocks:
  - ITEM-D-013
  - ITEM-D-014
  - ITEM-D-016
  owner: I2
  status: closed
  answer: Customer approves ITEM-D-013, ITEM-D-014 and ITEM-D-016.
  evidence: null
- id: E-16
  kind: experiment
  text: Can every path point keep 1.0 m clearance (ITEM-D-016) when the UAV itself is closer than that to a voxel
    observed after it arrived?
  blocks:
  - ITEM-D-016
  owner: I2
  status: closed
  answer: 'No: without an allowance near the start, 70-95 % of plans failed at the start and RETURN never planned
    (2/2 runs); ITEM-D-016 needs a bounded exception near a blocked start.'
  evidence: evidence/E-16.md
- id: Q-09
  kind: customer_question
  text: 'Do you approve the amended ITEM-D-016: paths keep at least 1.0 m from walls, except within 1.5 m of a start
    where the UAV is already closer than 1.0 m (because rock was seen only after arriving); there the path may only
    move away and never gets closer to any wall than the UAV already is?'
  blocks:
  - ITEM-D-016
  owner: I2
  status: closed
  answer: Customer approves the amended ITEM-D-016 (escape zone near a start already inside the clearance).
  evidence: null
- id: Q-10
  kind: customer_question
  text: 'For your 2-minute no-movement failure: (a) is ''does not move'' correctly read as ''the estimated position
    stays within 1.0 m of where it was, for any 120 s stretch between take-off and arriving back at the entrance''?
    (b) Should time the UAV deliberately hovers (waiting for state estimates to resume, or while no safe path to
    any goal is found) count toward the 2 minutes, or be excluded? (c) After the failure is declared, the UAV stops
    taking new goals and hovers where it is, writes both files and reports the failure. Is that what you want?'
  blocks:
  - SYS-F-016
  - SYS-F-017
  owner: I2
  status: closed
  answer: (a) yes, 1.0 m over any 120 s from take-off to return; (b) deliberate holds count; (c) see Q-11.
  evidence: null
- id: Q-11
  kind: customer_question
  text: 'Review round 2 (cap reached) left two conflicts for you to settle. Proposed resolutions: (1) a failure
    declared during the approach also stops the predefined route: SYS-F-017 takes precedence over SYS-F-001, SYS-F-006
    and SYS-S-003, and the failed state lasts until the run ends; (2) the failure is declared once: SYS-F-016 triggers
    ''the first time'' the condition holds, and its window ends when the UAV comes within 1.0 m of the entrance
    after four lanterns have been reported (not on a pass near the mouth while exploring). Approve?'
  blocks:
  - SYS-F-016
  - SYS-F-017
  owner: I2
  status: closed
  answer: A declared failure ends the run immediately (files written, failure reported); it exists to avoid waiting
    30 min on an inoperative UAV. Window ends at the return after four lanterns.
  evidence: null
- id: Q-12
  kind: customer_question
  text: 'Do you approve the critical design statements for the no-movement failure: ITEM-D-022 (1 Hz position watch,
    failure declared within 2 s of a 120 s stretch within 1.0 m), ITEM-D-023 (after failure no more paths; exit
    once the map is written or after 8 s), ITEM-D-024 (the launch file stops every process when the mission node
    exits), ITEM-D-025 (the mapper writes the map files on failure)?'
  blocks:
  - ITEM-D-022
  - ITEM-D-023
  - ITEM-D-024
  - ITEM-D-025
  owner: I2
  status: closed
  answer: Customer approves ITEM-D-022..025.
  evidence: null
- id: E-17
  kind: experiment
  text: Does ITEM-D-022's state list (TAKEOFF..RETURN) cover every window SYS-F-016 watches?
  blocks:
  - ITEM-D-022
  owner: I2
  status: closed
  answer: 'No: a HOLD reached with fewer than four lanterns is unwatched, and RETURN at the entrance with four lanterns
    is watched; the scope must be the parent''s window.'
  evidence: evidence/E-17.md
- id: Q-13
  kind: customer_question
  text: 'Do you approve the corrected ITEM-D-022: the 2-minute no-movement watch runs from take-off until the UAV
    is back at the entrance with four lanterns reported (so a UAV that returns with fewer lanterns and just hovers
    is also declared failed), instead of stopping at any final hover?'
  blocks:
  - ITEM-D-022
  owner: I2
  status: closed
  answer: Customer approves the corrected ITEM-D-022 (watch until back at the entrance with four lanterns).
  evidence: null
- id: Q-14
  kind: customer_question
  text: Do you approve the double-reviewed I2 implementation of the critical requirements SYS-C-002, SYS-F-006,
    SYS-S-001, ITEM-D-013, ITEM-D-014, ITEM-D-016, SYS-F-016, SYS-F-017, SYS-F-018, SYS-F-019, SYS-F-020, ITEM-D-023,
    ITEM-D-024, ITEM-D-025 (unit 105/105; nominal sim runs 25/25 twice; failure sim run 8/8)?
  blocks:
  - SYS-C-002
  - SYS-F-006
  - SYS-S-001
  - ITEM-D-013
  - ITEM-D-014
  - ITEM-D-016
  - SYS-F-016
  - SYS-F-017
  - SYS-F-018
  - SYS-F-019
  - SYS-F-020
  - ITEM-D-023
  - ITEM-D-024
  - ITEM-D-025
  owner: I2
  status: closed
  answer: Customer approves the I2 implementation of the listed CRIT-A requirements.
  evidence: null
- id: Q-15
  kind: customer_question
  text: Do you approve the implementation of the corrected ITEM-D-022?
  blocks:
  - ITEM-D-022
  owner: I2
  status: closed
  answer: Customer approves the ITEM-D-022 implementation.
  evidence: null
- id: E-18
  kind: experiment
  text: Is the tunnel system holding Lantern, Lantern (1) and Lantern (2) connected to the gallery by a passage
    a UAV can fly (at least 2 m clearance), and where? The reference surfaces alone show no inside connection even
    at 1 m clearance (E-10 (not published) route probe); parts of the shell are closed only by the Unity terrain, which covers x
    from ⟨…⟩ m eastwards.
  blocks:
  - SYS-P-005
  owner: I4
  status: closed
  answer: Connected via (⟨…⟩) (11/18 runs); current exploration does not reach Lantern (2) or Lantern in 30
    min (heads west, dithers in the far corner; Lantern 45-60 m deeper than flown); a southern branch near the mouth
    leads out of the cave (3/18). I4 must change the exploration strategy.
  evidence: evidence/E-18.md
- id: Q-16
  kind: customer_question
  text: 'Do you approve the I3 critical design statements? ITEM-D-026: a lantern sighting is a blob of exact lantern
    colour with depth, at most 45 m away, counted only after the entrance. ITEM-D-027: the position is estimated
    from all sightings'' 3D points, the nearest kept first (0.43 m error with near views, at most 1.5 m from far
    views only; your limit is 2 m). ITEM-D-028: sightings within 8 m belong to the same lantern, and a lantern is
    reported after 3 sightings; if two reported lanterns turn out to be one, the earlier one survives with both
    lanterns'' data (review round 2 conflict B3). ITEM-D-029: only lanterns beyond the entrance plane are reported,
    so the start lantern is excluded.'
  blocks:
  - ITEM-D-026
  - ITEM-D-027
  - ITEM-D-028
  - ITEM-D-029
  owner: I3
  status: closed
  answer: Customer approves ITEM-D-026..029 with the D-20 merge rule.
  evidence: null
- id: E-19 (not published)
  kind: experiment
  text: Does the I2 exploration keep the UAV clear of the cave surface on long (10+ min) flights? (SYS-S-001 was
    verified on 150 s explorations only.)
  blocks:
  - SYS-S-001
  owner: I3
  status: closed
  answer: 'No: in a 9.7 min run the explorer climbed to z 51.8 m (37 m above E), above the terrain over the cave
    mesh whose back faces the camera cannot see, and touched the surface; all incidents were more than 20 m above
    E, no goal at or below 33 m had one.'
  evidence: evidence/E-19.md (not published)
- id: Q-17
  kind: customer_question
  text: 'A 10-minute exploration run touched the cave (SYS-S-001 violated): the UAV climbed 37 m above the entrance,
    where the camera cannot map what is above and below it. Do you approve the new critical design statement ITEM-D-031:
    planned paths never go more than 20 m above the cave entrance? All lanterns and every region the missions have
    used so far lie below that height. (Over the question budget because a CRIT-A child requirement needs the customer''s
    approval; it is neither an experiment nor a design decision.)'
  blocks:
  - ITEM-D-031
  owner: I3
  status: closed
  answer: 'Customer rejects a fixed ceiling and approves the revised ITEM-D-031: only camera-revealable (horizontal)
    frontiers, vertical travel weighted 3x.'
  evidence: evidence/E-19.md (not published)
- id: Q-18
  kind: customer_question
  text: 'Contact with simulator surfaces that are invisible from one side (1 of 5 long runs): (A) build bump detection,
    obstacle marking, replanning and an in-flight path re-check, then decide acceptance on the measured rate; (B)
    accept now.'
  blocks:
  - ITEM-D-032
  - ITEM-D-033
  owner: I3
  status: closed
  answer: Customer chose A (then decide on the measured contact rate).
  evidence: evidence/E-19.md (not published)
- id: Q-19
  kind: customer_question
  text: How should SYS-S-001 be judged given simulator objects the depth camera cannot see; and do you approve the
    I3 deviations (2 m minimum sighting range; in-flight check only for obstacles mapped after planning)?
  blocks:
  - SYS-S-001
  - ITEM-D-026
  - ITEM-D-033
  owner: I3
  status: closed
  answer: 'Visible surfaces only: no contact with surfaces the camera can see; brief contact with invisible objects
    is acceptable if the UAV recovers and continues (SYS-S-004). Both deviations approved.'
  evidence: evidence/E-19.md (not published)
- id: Q-20
  kind: customer_question
  text: Do you approve the I3 implementation of its CRIT-A requirements?
  blocks:
  - SYS-F-004
  - SYS-P-001
  owner: I3
  status: closed
  answer: Customer approves the I3 CRIT-A implementation and signs off evidence/I3-inspection.md.
  evidence: evidence/I3-inspection.md
- id: E-20
  kind: experiment
  text: Can sensed data tell exploration goals outside the cave (a branch near the mouth leads outdoors, 3/18 runs)
    from goals inside it?
  blocks:
  - SYS-P-005
  owner: I4
  status: closed
  answer: 'Yes: sky-evidence fraction in a cylinder above the point (R 8 m, 5-45 m up) is >= 0.187 outdoors and
    <= 0.101 in the gallery; threshold 0.15 separates them (one probe flight).'
  evidence: evidence/E-20.md
- id: E-21
  kind: experiment
  text: Where does exploration time go, and what pace does a four-lantern mission within 1800 s need?
  blocks:
  - SYS-P-002
  owner: I4
  status: closed
  answer: Stationary 26-30 % (planning 11-13 %), moving 1.64-1.76 m/s, pace 1.14-1.30 m/s; the about 2400 m tour
    needs about 1.6 m/s.
  evidence: evidence/E-21.md
- id: Q-21
  kind: customer_question
  text: 'Do you approve the I4 critical design statement ITEM-D-035 (outdoor frontiers, whose sky evidence fills
    at least 15 % of a cylinder above them, are not exploration goals), and the resolution of review conflict N1:
    corners are rounded by arcs that stay within 0.25 m of the planned path, flown at a speed the acceleration limit
    allows (ITEM-D-040)?'
  blocks:
  - ITEM-D-035
  - ITEM-D-040
  owner: I4
  status: closed
  answer: Customer approves ITEM-D-035 and the arc-corner resolution (ITEM-D-040).
  evidence: evidence/E-20.md
- id: Q-22
  kind: customer_question
  text: Should the visualization always open with the mission, or open by default with a launch option to switch
    it off (for example on a machine without a display, or for judging runs)?
  blocks:
  - SYS-F-022
  owner: I4
  status: closed
  answer: Open by default, with a launch option to switch it off; requirements validated.
  evidence: null
- id: E-22
  kind: experiment
  text: With the mission view on, is every 30 s average of the depth and semantic frame rates during the first
    300 s in the cave at least 90 % of the mean rate with the view off (3 alternating pairs of 7 min runs)?
  blocks:
  - SYS-P-006
  owner: I4
  status: closed
  answer: 'Yes: lowest 30 s window with the view on 5.03 Hz for both cameras, 98 % of 5.11 Hz with it off (3 pairs).'
  evidence: evidence/E-22.md
- id: E-23
  kind: experiment
  text: Is the map voxel that stood 0.63 m from the UAV in run 20260930-023723 a surface, and how common are such
    lone voxels?
  blocks:
  - ITEM-D-041
  owner: I4
  status: closed
  answer: 'No: nothing else in the map within 2 m of it and the reference surface is over 2 m away. Lone voxels
    (no other within 1 m) are 153-197 per run, 90-145 of them over 2 m from the surface (0.009-0.013 % of cells).'
  evidence: evidence/E-23.md
- id: E-24
  kind: experiment
  text: Where did the exploration time of run 20260930-023723 go after Lantern (2), and why were Lantern and
    Lantern (1) not reached?
  blocks:
  - ITEM-D-036
  owner: I4
  status: closed
  answer: 'From 1200 s the explorer followed frontier goals 8-11 m above its own track (z 18-25 over a track at z
    9-14), 500 m back towards the entrance; 3632 frontier bins were left at the end, at every height.'
  evidence: evidence/E-24.md
- id: E-25
  kind: experiment
  text: 'Validation of ITEM-D-042 and ITEM-D-043 after the I4 design review cap: over the next full runs, is the time spent on goals
    above or below the flown track lower than in run 20260930-023723 (480 s), and is no lantern found only in a
    deferred leftover?'
  blocks:
  - ITEM-D-042
  - ITEM-D-043
  owner: I4
  status: closed
  answer: 'ITEM-D-043: goals within 6 m of an earlier goal 0 % of goal time in 6 runs (7-36 % before). ITEM-D-042: no
    deferred goal chosen in 5 runs and no lantern found only in a deferred leftover; the ceiling backtrack of run
    20260930-023723 did not recur. Both validated.'
  evidence: evidence/E-26.md
- id: Q-23
  kind: customer_question
  text: 'The delivered cave map now leaves out lone voxels: an occupied voxel with no other one within 1.0 m. There
    are 90-145 of them per run (0.01 % of the map), and each is more than 2 m from the real cave surface: depth noise
    in open air (E-23). One of them, 0.63 m from the UAV, made the "never within 0.5 m of a surface the camera saw"
    check fail, with the real surface over 2 m away. With them removed, that check is judged against the cleaned
    map. Do you accept this (ITEM-D-041)?'
  blocks:
  - ITEM-D-041
  owner: I4
  status: closed
  answer: Customer accepts the removal of lone voxels (ITEM-D-041); the surface check uses the cleaned map.
  evidence: evidence/E-23.md
- id: E-26
  kind: experiment
  text: How much exploration time goes to goals near earlier goals (revisits)?
  blocks:
  - ITEM-D-043
  owner: I4
  status: closed
