- id: SYS-S-002
  text: If no state estimate message arrives for 0.5 s, then the UAV system shall stop issuing new flight goals until state estimates resume.
  category: safety
  criticality: B
  rationale: Estimator dropouts are a leading field failure mode in subterranean UAV missions. Planning without a pose is unsafe.
  source: 'Research: SubT lessons learned, arXiv:2110.04390, arXiv:2404.17759'
  parent: null
  allocated_to:
  - cave_mission
  moc: test
  verified_by: []
  status: implemented
  waiver: null
  suspect: false
  target: null
  threshold: null
  increment: I1
- id: SYS-S-003
  text: If the planner finds no collision-free path to the current goal, then the UAV system shall hold the UAV at its current position and select another goal.
  category: safety
  criticality: B
  rationale: Avoids flying blind into unmapped space when exploration stalls.
  source: BRIEF.md 4.2; CONOPS use case 3
  parent: null
