requirements:
- id: SYS-F-001
  text: When the mission starts, the UAV system shall fly the UAV along a predefined waypoint route from the start point to the cave entrance point.
  category: functional
  criticality: A
  rationale: 'Success criterion 1: the UAV arrives at the cave entrance. Predefined waypoints are allowed only up to the entrance.'
  source: BRIEF.md 1, 4.2, 4.4, 5.1
  parent: null
  allocated_to:
  - cave_mission
  - cave_planning
  moc: test
  verified_by: []
  status: implemented
  waiver: null
  suspect: false
  target: null
  threshold: null
  increment: I1
- id: SYS-F-002
  text: When the UAV first comes within 1.0 m of the cave entrance point, the UAV system shall publish an entrance-reached event carrying the simulation timestamp.
  category: functional
  criticality: A
  rationale: The 30-minute clock starts at this instant, so it must be observable. 1.0 m is a proposed arrival tolerance.
  source: BRIEF.md 4.4, 5.5
  parent: null
  allocated_to:
  - cave_mission
  moc: test
  verified_by:
  - tools/sim_tests/test_i1_mission.py::test_entrance_event_published_once_when_uav_at_entrance
  status: verified
  waiver: null
  suspect: false
  target: null
  threshold: null
  increment: I1
- id: SYS-F-003
  text: When the UAV first comes within 1.0 m of the cave entrance point, the UAV system shall write a log line containing the simulation timestamp of that instant.
  category: functional
  criticality: B
  rationale: Brief allows publish or log; the log survives a crashed run and is what the scorer reads.
  source: BRIEF.md 4.4
