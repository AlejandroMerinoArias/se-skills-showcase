  text: The UAV system shall complete the mission without the UAV touching any cave or terrain surface that its depth camera can observe.
  category: safety
  criticality: A
  rationale: 'A collision ends a run. Customer (Q-19): the simulator has solid objects the depth camera never shows (E-19 (not published)); contact with those is judged by SYS-S-004 instead.'
