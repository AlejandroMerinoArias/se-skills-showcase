  text: The UAV system shall report each cave lantern position within 2.0 m (Euclidean distance) of the centre of the visible lantern.
  category: performance
  criticality: A
  rationale: 'Success criterion 2; the customer defines true position as the visible lantern centre (Q-06). E-04: estimator error <= 0.02 m, so the budget goes to detection and localisation.'
  source: BRIEF.md 5.2
  parent: null
