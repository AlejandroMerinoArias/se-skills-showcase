- id: SYS-P-002
  text: The UAV system shall complete the mission, from the entrance-reached event until the UAV is back within 1.0 m of the entrance with four lanterns reported, within 1800 s of simulation time.
  category: performance
  criticality: A
  rationale: Success criterion 5. 'As fast as possible' in 1.1 motivates a 900 s design target.
  source: BRIEF.md 1.1, 5.5
  parent: null
